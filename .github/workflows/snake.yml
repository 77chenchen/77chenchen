name: Refresh GitHub profile graphics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/render-profile.py'

permissions:
  contents: write

concurrency:
  group: publish-contribution-snake

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate the contribution calendar and animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ runner.temp }}/snake.svg
      - name: Fetch the public contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$PROFILE_LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  totalCommitContributions
                  totalPullRequestContributions
                  totalIssueContributions
                  totalPullRequestReviewContributions
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }
          ' --jq '.data.user.contributionsCollection' > "$RUNNER_TEMP/activity.json"
      - name: Render the light and dark graphics
        run: python3 scripts/render-profile.py "$RUNNER_TEMP/snake.svg" "$RUNNER_TEMP/activity.json" dist
      - name: Publish the styled SVGs
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
