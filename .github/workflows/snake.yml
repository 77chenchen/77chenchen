name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"       # 每天 00:00 UTC 运行（新加坡可改到 16:00 UTC≈00:00 SGT）
  workflow_dispatch:           # 允许手动触发
  push:
    branches: ["main"]         # 可选：当你更新 README 时顺带生成

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore       # 你的时区
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: 77chenchen
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            # 想自定义颜色可加（示例）：
            # dist/snake-custom.svg?color_snake=white&color_dots=#444,#888,#BBB,#EEE
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output   # 把生成物推到 output 分支
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
