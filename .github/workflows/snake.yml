name: Generate contribution snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/style-snake.py'

permissions:
  contents: write

concurrency:
  group: publish-contribution-snake

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch the public contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$PROFILE_LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks { contributionDays { weekday contributionLevel } }
                  }
                }
              }
            }
          ' --jq '.data.user.contributionsCollection.contributionCalendar.weeks' > "$RUNNER_TEMP/calendar.json"
      - name: Render the contribution snake
        run: python3 scripts/style-snake.py "$RUNNER_TEMP/calendar.json" dist
      - name: Publish the styled SVGs
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
